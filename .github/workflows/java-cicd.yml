name: Train Ticket Reservation CI/CD

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted

    env:
      ECR_REPOSITORY: demo_repo
      AWS_REGION: us-east-1
      ECS_CLUSTER: demo-cluster
      ECS_SERVICE: advanced-server-z5900y-service-vmx28bet
      IMAGE_TAG: latest
      
      
      
    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
         distribution: temurin
         java-version: '17'
         cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
         docker build -t demo_repo:latest .

      - name: Tag Docker Image
        run: |
         docker tag demo_repo:latest \
           ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/demo_repo:latest

      - name: Push Docker Image
        run: |
         docker push \
           ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/demo_repo:latest
      - name: Update ECS Task Definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s|<IMAGE>|$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" task-Definition.json
          cat task-Definition.json > new-task.json

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: new-task.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
